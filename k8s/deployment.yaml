apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-management
  labels:
    app: school-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: school-management
  template:
    metadata:
      labels:
        app: school-management
    spec:
      containers:
        - name: school-management
          image: xyunusemre/school-management:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_NAME
              value: "schooldb"
            - name: DB_USER
              value: "root"
            - name: DB_PASS
              value: "root123"
